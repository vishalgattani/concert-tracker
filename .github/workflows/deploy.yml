name: Nightly Deploy

on:
  push:
    branches: [develop]
  schedule:
    - cron: '0 6 * * *'  # 11pm PT (UTC-7)
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy to Vercel
        timeout-minutes: 10
        run: npx vercel --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: team_ScbUahw2QbWHpPXESXiLbexa
          VERCEL_PROJECT_ID: prj_vq5kiT63LmCYz8g2hEaCZSYMageO
